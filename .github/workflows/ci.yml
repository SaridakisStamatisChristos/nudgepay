name: CI

on:
  push:
    branches: ["**"]          # all branches
  pull_request:
    branches: ["**"]          # all PR targets

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # All shell steps run from the app directory
    defaults:
      run:
        shell: bash
        working-directory: nudgepay

    # Job-wide environment
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TZ: UTC
      CI: "true"


    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: nudgepay/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run CI (lint, tests, security, release checks)
        run: make ci

      - name: Export isolated test-only CI credentials
        run: python scripts/ci_env.py >> "$GITHUB_ENV"

      - name: Apply database migrations (retry until Postgres healthy)
        run: |
          for i in {1..10}; do
            alembic upgrade head && s=0 && break || s=$?
            echo "alembic failed (attempt $i), retrying in 3s..."
            sleep 3
          done
          exit $s

      - name: Validate staging release configuration
        run: ENVIRONMENT=staging python -m nudgepay.scripts.validate_release

      - name: Run schema rehearsal against Postgres
        env:
          ENVIRONMENT: staging
        run: python -m nudgepay.scripts.schema_rehearsal --json

      # Optional: upload artifacts (coverage, junit, etc.)
      # - name: Upload coverage
      #   if: success() || failure()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: coverage
      #     path: htmlcov
